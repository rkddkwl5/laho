    <style>
        /* 기본 스타일 초기화 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at center, #1a153a 0%, #0d0b18 100%);
            color: #ffffff;
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* 영화 스크린 같은 몽환적인 배경 효과 */
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(57, 255, 20, 0.05) 0%, transparent 60%);
            z-index: 1;
            pointer-events: none;
        }

        /* 메인 콘텐츠 영역 */
        .inner {
            text-align: center;
            z-index: 2;
            padding: 20px;
            max-width: 800px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            line-height: 1.6;
            margin-bottom: 2rem;
            letter-spacing: -0.5px;
            word-break: keep-all;
            color: #e2e8f0;
        }

        /* 강조하고 싶은 부분에 형광 초록 적용 */
        h1 br + text, h1 {
            text-shadow: 0 0 20px rgba(57, 255, 20, 0.2);
        }

        h3 {
            font-size: 1.5rem;
            font-weight: 400;
            color: #39FF14; /* 형광 초록 */
            text-shadow: 0 0 10px rgba(57, 255, 20, 0.5);
            letter-spacing: 2px;
            margin-bottom: 3rem;
        }

        /* 하단 내비게이션 / 버튼 영역 */
        .header-container {
            z-index: 2;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        #openPopupBtn {
            background: transparent;
            color: #39FF14;
            border: 2px solid #39FF14;
            padding: 14px 32px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.2);
            letter-spacing: 1px;
        }

        /* 버튼 호버 효과 (마우스를 올렸을 때) */
        #openPopupBtn:hover {
            background: #39FF14;
            color: #0d0b18;
            box-shadow: 0 0 30px rgba(57, 255, 20, 0.6);
            transform: translateY(-3px);
        }

        /* 버튼 클릭 효과 */
        #openPopupBtn:active {
            transform: translateY(-1px);
        }

        /* 반응형 모바일 스타일 */
        @media (max-width: 768px) {

            }

        }
